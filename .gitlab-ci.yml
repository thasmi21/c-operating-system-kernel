# Gitlab ci/cd file configuration 
image: sebastienviardot/pcsefriscv:20220709
stages:
    - verif
student_test:
    stage: verif 
    script:
        - cd src && make kernel.bin && curl --request POST --form "token=${TRIGGER_TOKEN}" --form "ref=master" "${CI_API_V4_URL}/projects/${EVAL_PROJECT_ID}/trigger/pipeline"
    artifacts:
        paths:
            - ./src/**/*.c
            - ./src/**/*.h
            - ./src/**/*.S
    only:
        - master


